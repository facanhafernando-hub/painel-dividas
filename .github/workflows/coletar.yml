name: Coletar dados

on:
  schedule:
    # horários em UTC (Brasília = UTC-3)
    - cron: "47 23 * * 1-5"   # 20:47 BRT: ANBIMA do dia (publica até 20h) e B3 se já disponível
    - cron: "17 2 * * 2-6"    # 23:17 BRT: segunda passada
    - cron: "43 12 * * 1-5"   # 09:43 BRT: B3 consolida o dia anterior de manhã
  workflow_dispatch:
    inputs:
      data:
        description: "Data AAAA-MM-DD (vazio = hoje)"
        required: false
      backfill:
        description: "Dias úteis anteriores a reprocessar"
        required: false
        default: "0"
      recalcular:
        description: "Só recalcular par/yield dos dias já coletados (sim/não)"
        required: false
        default: "não"
      forcar:
        description: "Refazer datas já completas (sim/não)"
        required: false
        default: "não"

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre a versão mais recente (inclui dados gravados por execuções anteriores)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar coletor
        env:
          TZ: America/Sao_Paulo
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.data }}" ]; then ARGS="$ARGS --data ${{ github.event.inputs.data }}"; fi
          if [ -n "${{ github.event.inputs.backfill }}" ]; then ARGS="$ARGS --backfill ${{ github.event.inputs.backfill }}"; fi
          if [ "${{ github.event.inputs.forcar }}" = "sim" ]; then ARGS="$ARGS --forcar"; fi
          if [ "${{ github.event.inputs.recalcular }}" = "sim" ]; then ARGS="--recalcular"; fi
          # a passada das 23:17 BRT roda já no dia seguinte em UTC, mas o script usa a data de Brasília
          python coletor/coletar.py $ARGS

      - name: Salvar dados no repositório
        if: always()
        run: |
          git config user.name "painel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "dados: $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
            git pull --rebase --autostash -X theirs   # em conflito, fica com os dados recém-calculados
            git push
          fi
