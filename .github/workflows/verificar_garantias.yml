name: Verificar garantias

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-por > /dev/null
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: escrituras-x
          restore-keys: escrituras-
      - run: python coletor/verificar_garantias.py
      - name: Salvar
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add docs/data/_debug/verificacao_garantias.json
          git diff --cached --quiet && exit 0
          git commit -qm "Verificação de garantias"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs -q && git push -q && break; sleep 10; done
