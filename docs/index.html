<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Painel de Dívidas · Mercado Secundário</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2; --surface-1: #fcfcfb; --surface-2: #f0efec; --border: #e2e1dc;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
    --series-1: #2a78d6; --series-2: #eb6834; --bar: #2a78d6;
    --pos: #0f7a3d; --neg: #c0362c; --amb: #9a6400;
    --crit-bg: #fde8e7; --crit-fg: #9b1c16; --warn-bg: #fdf1d8; --warn-fg: #7a4e00;
    --info-bg: #e5effb; --info-fg: #174f93; --neu-bg: #ecebe7; --neu-fg: #52514e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #111110; --surface-1: #1a1a19; --surface-2: #232321; --border: #33332f;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
      --series-1: #3987e5; --series-2: #d95926; --bar: #3987e5;
      --pos: #4cc27e; --neg: #ef7a70; --amb: #e3b04b;
      --crit-bg: #4a1d1a; --crit-fg: #ffb4ad; --warn-bg: #3d2f10; --warn-fg: #f3cf7c;
      --info-bg: #17304f; --info-fg: #a9cbf5; --neu-bg: #2b2b28; --neu-fg: #c3c2b7;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text-primary);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
         font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); }
  .top { max-width: 1240px; margin: 0 auto; padding: 12px 20px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .ref { color: var(--text-muted); font-size: 12px; }
  nav { max-width: 1240px; margin: 0 auto; padding: 0 20px; display: flex; gap: 22px; }
  nav a { padding: 10px 0 9px; color: var(--text-secondary); font-weight: 550; border-bottom: 2px solid transparent; }
  nav a.on { color: var(--text-primary); border-bottom-color: var(--text-primary); }
  main { max-width: 1240px; margin: 0 auto; padding: 16px 20px 60px; }
  .sub { color: var(--text-secondary); font-size: 12.5px; }
  .mut { color: var(--text-muted); }
  .neg { color: var(--neg); } .pos { color: var(--pos); } .amb { color: var(--amb); }
  .barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  input[type=search], select { background: var(--surface-1); color: var(--text-primary);
         border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; font: inherit; }
  input[type=search] { flex: 1 1 260px; max-width: 420px; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
          border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed=true] { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; margin-right: 3px; font-weight: 600; white-space: nowrap; }
  .t-crit { background: var(--crit-bg); color: var(--crit-fg); } .t-warn { background: var(--warn-bg); color: var(--warn-fg); }
  .t-info { background: var(--info-bg); color: var(--info-fg); } .t-neu { background: var(--neu-bg); color: var(--neu-fg); }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; }
  .emp { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 18px; align-items: center;
         padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .emp:last-child { border-bottom: 0; }
  .emp:hover { background: var(--surface-2); }
  .emp .n { font-weight: 620; }
  .emp .v { text-align: right; min-width: 92px; }
  .emp .v b { display: block; font-weight: 600; }
  .emp .v span { font-size: 11.5px; color: var(--text-muted); }
  .cab-emp { display: grid; grid-template-columns: 1fr auto auto; gap: 18px; padding: 8px 16px; font-size: 11.5px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  .cab-emp div:not(:first-child) { text-align: right; min-width: 92px; }
  .voltar { display: inline-block; color: var(--text-secondary); font-size: 13px; margin-bottom: 8px; }
  h2 { font-size: 22px; margin: 0 0 2px; letter-spacing: -.02em; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin: 14px 0; }
  .kpi { padding: 11px 14px; }
  .kpi .l { font-size: 11.5px; color: var(--text-secondary); }
  .kpi .v { font-size: 20px; font-weight: 650; margin-top: 1px; letter-spacing: -.02em; }
  .rel { font-size: 12.5px; color: var(--text-secondary); margin-top: 6px; }
  .rel a { text-decoration: underline; text-underline-offset: 2px; margin-right: 10px; }
  .tw { overflow: auto; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th { position: sticky; top: 0; background: var(--surface-2); color: var(--text-secondary); font-weight: 600; font-size: 11.5px; cursor: pointer; user-select: none; }
  th[data-ord]::after { content: attr(data-ord); margin-left: 4px; }
  td.l, th.l { text-align: left; }
  tbody tr { cursor: pointer; } tbody tr:hover td { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: 0; }
  td .cod { font-weight: 650; } td .tp { font-size: 10.5px; color: var(--text-muted); margin-left: 5px; font-weight: 600; }
  .ell { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .nota { color: var(--text-muted); font-size: 12px; margin-top: 10px; line-height: 1.5; }
  .vazio { padding: 40px; text-align: center; color: var(--text-secondary); }
  .cards { display: none; }
  .tc { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .tc:last-child { border-bottom: 0; }
  .tc .l1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .tc .l2 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; margin-top: 8px; }
  .tc .l2 div span { display: block; font-size: 11px; color: var(--text-muted); }
  .tc .l2 div b { font-weight: 600; font-size: 13px; white-space: nowrap; }
  #det { position: fixed; inset: 0 0 0 auto; width: min(620px, 100vw); background: var(--surface-1);
         border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgba(0,0,0,.12);
         transform: translateX(100%); transition: transform .2s ease; overflow-y: auto; z-index: 10; }
  #det.aberto { transform: none; }
  #det .topo { position: sticky; top: 0; background: var(--surface-1); padding: 16px 18px 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; z-index: 1; }
  #det h3 { margin: 0; font-size: 18px; }
  #det .corpo { padding: 14px 18px 30px; }
  .fechar { background: none; border: 1px solid var(--border); color: var(--text-primary); border-radius: 8px; padding: 4px 10px; cursor: pointer; font: inherit; height: fit-content; }
  .grade { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px 14px; margin: 4px 0 16px; }
  .grade .l { font-size: 11.5px; color: var(--text-secondary); }
  .grade .v { font-weight: 600; }
  .grade .dest .v { font-size: 20px; letter-spacing: -.02em; }
  .graf h4 { font-size: 13px; margin: 16px 0 2px; font-weight: 600; }
  .legenda { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); margin: 2px 0 4px; flex-wrap: wrap; }
  .legenda i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; }
  .graf svg { width: 100%; height: auto; display: block; }
  .graf .grid { stroke: var(--border); stroke-width: 1; }
  .graf .eixo { fill: var(--text-muted); font-size: 10.5px; }
  #tip { position: fixed; pointer-events: none; background: var(--text-primary); color: var(--surface-1); font-size: 12px; padding: 6px 9px; border-radius: 6px; display: none; z-index: 20; white-space: nowrap; }
  @media (max-width: 760px) {
    .top, nav, main { padding-left: 14px; padding-right: 14px; }
    .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .tabela-titulos { display: none; } .cards { display: block; }
    .emp { grid-template-columns: 1fr auto; } .emp .v.hide-m, .cab-emp .hide-m { display: none; }
    .cab-emp { grid-template-columns: 1fr auto; }
    .grade { grid-template-columns: repeat(2, minmax(0,1fr)); }
    h2 { font-size: 19px; }
  }
</style>
</head>
<body>
<header>
  <div class="top"><h1>Painel de Dívidas · Mercado Secundário</h1><span class="ref" id="ref"></span></div>
  <nav><a href="#/" id="nEmp">Empresas</a><a href="#/mercado" id="nMer">Mercado do dia</a><a href="#/curva" id="nCur">Curva de juros</a></nav>
</header>
<main id="app"><div class="vazio">Carregando…</div></main>
<aside id="det" aria-hidden="true">
  <div class="topo"><div><h3 id="detTit"></h3><div class="sub" id="detSub"></div></div><button class="fechar" onclick="fecharDet()">Fechar</button></div>
  <div class="corpo" id="detCorpo"></div>
</aside>
<div id="tip"></div>

<script>
const nf = d => new Intl.NumberFormat("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const f0 = nf(0), f1 = nf(1), f2 = nf(2), f4 = nf(4);
const nada = v => v === null || v === undefined || Number.isNaN(v);
const fmt = (v, f = f2) => nada(v) ? "–" : f.format(v);
const mi = v => !v ? "–" : v >= 1e9 ? f2.format(v / 1e9) + " bi" : v >= 1e6 ? f1.format(v / 1e6) + " mi" : f0.format(v / 1e3) + " mil";
const dbr = s => !s ? "–" : s.includes("-") ? s.split("-").reverse().join("/") : s;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const titulo = s => String(s || "").toLowerCase().replace(/(^|[\s\-\/(.])([a-zà-ú])/g, (m, a, b) => a + b.toUpperCase()).replace(/\bS\.A\.?|\bS\/A\b/gi, "S.A.").replace(/ (De|Da|Do|Das|Dos|E) /g, w => w.toLowerCase());
const semAc = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
const venData = s => { if (!s) return null; const p = s.split("/"); return p.length === 3 ? new Date(+p[2], +p[1] - 1, +p[0]) : null; };
const ordVen = s => { const d = venData(s); return d ? d.getTime() : 9e15; };

const ALERTAS = {
  vencida_antecipadamente: ["Vencida antecip.", "t-crit"], negociado_abaixo_par: ["Negociado < 80% par", "t-crit"],
  indicativo_abaixo_par: ["Indicativo < 80% par", "t-warn"], desvio_anbima: ["Desvio vs ANBIMA", "t-warn"],
  salto_volume: ["Salto de volume", "t-info"],
};
const ESSENCIAIS = ["vencida_antecipadamente", "salto_volume"];
const tagsE = al => tags((al || []).filter(k => ESSENCIAIS.includes(k)));
const tags = al => (al || []).map(k => `<span class="tag ${ALERTAS[k]?.[1] || "t-info"}">${ALERTAS[k]?.[0] || k}</span>`).join("");
const CR = { va: ["Venc. antecipado", "t-crit", 4], rj: ["RJ", "t-crit", 3], re: ["RE", "t-crit", 2], rp: ["Reperfilada", "t-warn", 1] };
const crTag = (cr, crr) => cr ? `<span class="tag ${CR[cr][1]}" title="${esc(crr || "")}">${CR[cr][0]}</span>` : "";
const crGrave = cr => cr === "va" || cr === "rj" || cr === "re";

function pctPar(v, extra = "") {
  if (nada(v)) return '<span class="mut">–</span>';
  const cl = v < 80 ? "neg" : v < 95 ? "amb" : "";
  return `<span class="${cl}"${extra}>${f1.format(v)}%</span>`;
}
function yieldTxt(y, base, est, pct) {
  if (nada(y) || !base) return base === "%DI" ? '<span class="mut" title="Papel em % do DI: veja a TIR nominal">% DI</span>' : '<span class="mut">–</span>';
  const t = base === "PRE" ? `${f2.format(y)}%` : `${base.replace("+", "")} + ${f2.format(y)}%`;
  const cor = !nada(pct) && pct < 80 ? ' class="neg"' : "";
  return est ? `<span${cor} title="Estimativa: CRI/CRA sem cronograma, supõe pagamento único no vencimento">≈ ${t}</span>` : `<span${cor}>${t}</span>`;
}
const tirTxt = (v, pct) => nada(v) ? '<span class="mut">–</span>' : `<span${!nada(pct) && pct < 80 ? ' class="neg"' : ""}>${f1.format(v)}%</span>`;
const moicTxt = v => nada(v) ? '<span class="mut">–</span>' : `${f2.format(v)}x`;
function taxaAnb(t, idx) {
  if (nada(t)) return '<span class="mut">–</span>';
  const s = semAc(idx);
  if (s.includes("DO DI")) return `${f2.format(t)}% DI`;
  if (s.startsWith("DI") || s.includes("CDI")) return `DI + ${f2.format(t)}%`;
  if (s.includes("IPCA")) return `IPCA + ${f2.format(t)}%`;
  if (s.includes("IGP")) return `IGP-M + ${f2.format(t)}%`;
  return `${f2.format(t)}%`;
}

async function getJSON(u) { const r = await fetch(u, { cache: "no-cache" }); if (!r.ok) throw new Error(u); return r.json(); }
const st = { idx: null, cat: null, empresas: null, dia: null, busca: "", filtroE: "todas", ordE: "vol", tipoM: "Todos", visM: "neg", ordM: "vol", dirM: -1, buscaM: "" };

async function carregarCatalogo() {
  if (st.cat) return;
  const c = await getJSON("data/catalogo.json");
  st.cat = c;
  const g = new Map();
  for (const i of c.itens) {
    if (!i.k) continue;
    let e = g.get(i.k);
    if (!e) { e = { k: i.k, nomes: {}, itens: [], vol: 0, negHoje: 0, pior: null, alerta: false, cnpj: i.cnpj }; g.set(i.k, e); }
    e.itens.push(i); e.nomes[i.e] = (e.nomes[i.e] || 0) + 1; if (i.n) e.curto = i.n;
    if (i.vh) { e.vol += i.vh; e.negHoje++; }
    const p = i.upp ?? i.ppa;
    if (!nada(p) && (e.pior === null || p < e.pior)) e.pior = p;
    if ((i.al || []).some(k => ESSENCIAIS.includes(k)) || (i.cat || "").includes("VENCID")) e.alerta = true;
    if (i.t === "CRI" || i.t === "CRA") { if (i.s && i.s === i.e) e.secs = (e.secs || 0) + 1; } else e.naoSec = true;
    if (!e.cnpj && i.cnpj) e.cnpj = i.cnpj;
    if (i.w) { e.lista = i.w; e.situacao = i.ws; }
    if (i.cr && (!e.cr || CR[i.cr][2] > CR[e.cr][2])) e.cr = i.cr;
  }
  for (const e of g.values()) {
    e.razao = Object.entries(e.nomes).sort((a, b) => b[1] - a[1])[0][0];
    e.nome = e.curto || titulo(e.razao);
    e.busca = semAc(e.nome + " " + e.razao + " " + e.k + " " + e.itens.map(i => i.c + " " + (i.s || "")).join(" "));
    e.grupo = e.k.split(" ")[0];
  }
  st.empresas = [...g.values()];
}

window.addEventListener("hashchange", rota);
async function rota() {
  fecharDet();
  const h = location.hash.replace(/^#\/?/, "");
  document.getElementById("nEmp").classList.toggle("on", !h.startsWith("mercado") && !h.startsWith("curva"));
  document.getElementById("nMer").classList.toggle("on", h.startsWith("mercado"));
  document.getElementById("nCur").classList.toggle("on", h.startsWith("curva"));
  try {
    if (h.startsWith("mercado")) await telaMercado();
    else if (h.startsWith("curva")) await telaCurva();
    else if (h.startsWith("e/")) await telaEmpresa(decodeURIComponent(h.slice(2)));
    else await telaEmpresas();
  } catch (e) {
    document.getElementById("app").innerHTML = `<div class="vazio">Ainda não há dados para esta tela. A coleta roda nos dias úteis às 9h43, 20h47 e 23h17.</div>`;
    console.error(e);
  }
  window.scrollTo(0, 0);
}

async function telaEmpresas() {
  await carregarCatalogo();
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="barra">
      <input type="search" id="bE" placeholder="Buscar empresa, código ou securitizadora" value="${esc(st.busca)}">
      <div class="chips" id="fE">
        ${[["todas", "Todas"], ["lista", "Minha lista"], ["cred", "Evento de crédito"], ["hoje", "Negociadas hoje"], ["desc", "Abaixo de 80% do par"]].map(([k, l]) => `<button class="chip" data-k="${k}" aria-pressed="${st.filtroE === k}">${l}</button>`).join("")}
      </div>
      <select id="oE">
        <option value="vol">Mais negociadas</option><option value="desc">Mais descontadas</option><option value="nome">A–Z</option><option value="tit">Mais títulos</option>
      </select>
    </div>
    <div class="card" id="listaE"></div>
    <div class="nota">Agrupado pelo emissor (debêntures) ou pelo devedor (CRI/CRA precificados pela ANBIMA; nos demais aparece a securitizadora). "Pior % do par" usa o último negócio dos últimos 30 pregões ou, sem negócio, o indicativo ANBIMA.</div>`;
  const oE = document.getElementById("oE"); oE.value = st.ordE;
  document.getElementById("bE").oninput = e => { st.busca = e.target.value; listaEmpresas(); };
  oE.onchange = e => { st.ordE = e.target.value; listaEmpresas(); };
  document.querySelectorAll("#fE .chip").forEach(b => b.onclick = () => { st.filtroE = b.dataset.k; document.querySelectorAll("#fE .chip").forEach(x => x.setAttribute("aria-pressed", x === b)); listaEmpresas(); });
  listaEmpresas();
}
function listaEmpresas() {
  const q = semAc(st.busca.trim());
  let L = st.empresas.filter(e => (!q || e.busca.includes(q)) &&
    (st.filtroE === "todas" || (st.filtroE === "lista" ? !!e.lista : st.filtroE === "cred" ? !!e.cr : st.filtroE === "hoje" ? e.negHoje > 0 : (e.pior !== null && e.pior < 80))));
  const S = { vol: (a, b) => b.vol - a.vol || b.itens.length - a.itens.length, desc: (a, b) => (a.pior ?? 999) - (b.pior ?? 999),
              nome: (a, b) => a.nome.localeCompare(b.nome), tit: (a, b) => b.itens.length - a.itens.length };
  L.sort(S[st.ordE]);
  const tot = L.length; L = L.slice(0, 200);
  document.getElementById("listaE").innerHTML = !L.length ? '<div class="vazio">Nenhuma empresa encontrada.</div>' :
    `<div class="cab-emp"><div>${f0.format(tot)} empresas${tot > 200 ? " (mostrando 200; refine a busca)" : ""}</div><div class="hide-m">Pior % do par</div><div>Volume hoje</div></div>` +
    L.map(e => `<a class="emp" href="#/e/${encodeURIComponent(e.k)}">
      <div><div class="n">${esc(e.nome)} ${crTag(e.cr)}${e.lista ? '<span class="tag t-info">lista</span>' : ""}${e.secs && !e.naoSec ? '<span class="tag t-neu" title="CRI/CRA sem devedor identificado pela ANBIMA">securitizadora</span>' : ""}${e.alerta ? '<span class="tag t-crit">alerta</span>' : ""}</div>
      <div class="sub">${e.situacao ? `<span style="color:var(--text-primary)">${esc(e.situacao)}</span> · ` : ""}${e.itens.length} título${e.itens.length > 1 ? "s" : ""}${e.negHoje ? ` · ${e.negHoje} negociado${e.negHoje > 1 ? "s" : ""} hoje` : ""}</div></div>
      <div class="v hide-m"><b>${pctPar(e.pior)}</b><span>pior título</span></div>
      <div class="v"><b>${e.vol ? "R$ " + mi(e.vol) : '<span class="mut">–</span>'}</b><span>${e.vol ? "negociado" : "sem negócio"}</span></div></a>`).join("");
}

async function telaEmpresa(k) {
  await carregarCatalogo();
  const e = st.empresas.find(x => x.k === k);
  const app = document.getElementById("app");
  if (!e) { app.innerHTML = '<a class="voltar" href="#/">← Empresas</a><div class="vazio">Empresa não encontrada.</div>'; return; }
  const itens = [...e.itens].sort((a, b) => ordVen(a.ven) - ordVen(b.ven));
  const generico = ["COMPANHIA", "CONCESSIONARIA", "BANCO", "CENTRAIS", "EMPRESA", "CIA", "SOCIEDADE", "ENERGIA", "RODOVIAS", "TRANSMISSORA"];
  const rel = e.grupo.length >= 4 && !generico.includes(e.grupo) ? st.empresas.filter(x => x !== e && x.grupo === e.grupo).slice(0, 6) : [];
  const cnpj = e.cnpj && e.cnpj.length >= 14 ? e.cnpj.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5") : null;
  app.innerHTML = `
    <a class="voltar" href="#/">← Empresas</a>

const COLS = [

  ["panb", "PU ANBIMA", r => r._panb ?? -1, r => fmt(r._panb)],

  ["ven", "Vencimento", r => ordVen(r.a?.vencimento), r => esc(r.a?.vencimento || "–")],
  ["al", "Alertas", r => r.al.length, r => tags(r.al), "l"],
];
function tabelaMercado() {
  const d = st.dia, q = semAc(st.buscaM.trim());
  let L = d.ativos.filter(r => (st.tipoM === "Todos" || r._grp === st.tipoM) &&
    (st.visM === "todos" || (st.visM === "neg" ? r._vol > 0 : r.al.length > 0)) &&
    (!q || r.c.includes(q) || semAc(r.e).includes(q) || semAc(r.s).includes(q)));
  const col = COLS.find(c => c[0] === st.ordM);
  L.sort((a, b) => { const x = col[2](a), y = col[2](b); return (x > y ? 1 : x < y ? -1 : 0) * st.dirM; });
  const vol = L.reduce((s, r) => s + r._vol, 0), neg = L.reduce((s, r) => s + r._neg, 0);
  document.getElementById("kM").innerHTML = [["Títulos negociados", f0.format(L.filter(r => r._vol).length)], ["Volume", "R$ " + mi(vol)],
    ["Negócios", f0.format(neg)], ["Com alerta", f0.format(L.filter(r => r.al.length).length)]].map(([l, v]) => `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
  const th = document.querySelector("#tM thead");
  th.innerHTML = "<tr>" + COLS.map(c => `<th class="${c[4] || ""}" data-k="${c[0]}" ${c[0] === st.ordM ? `data-ord="${st.dirM < 0 ? "▼" : "▲"}"` : ""}>${c[1]}</th>`).join("") + "</tr>";
  th.querySelectorAll("th").forEach(h => h.onclick = () => { if (st.ordM === h.dataset.k) st.dirM *= -1; else { st.ordM = h.dataset.k; st.dirM = ["cod", "emp", "ven", "ppar"].includes(st.ordM) ? 1 : -1; } tabelaMercado(); });
  const vis = L.slice(0, 1500);
  const tb = document.querySelector("#tM tbody");
  tb.innerHTML = vis.length ? vis.map((r, i) => `<tr data-i="${i}">` + COLS.map(c => `<td class="${c[4] || ""}">${c[3](r)}</td>`).join("") + "</tr>").join("") : `<tr><td class="vazio" colspan="${COLS.length}">Nenhum título com esses filtros.</td></tr>`;
  tb.querySelectorAll("tr[data-i]").forEach(tr => tr.onclick = async () => {
    const r = vis[+tr.dataset.i];
    await carregarCatalogo().catch(() => {});
    const i = st.cat?.itens.find(x => x.c === r.c);
    abrirTitulo(i || { c: r.c, t: r.t, e: r.e, s: r.s, ven: r.a?.vencimento, idx: r.a?.indice, al: r.al });
  });
}

function ligarSimulador(i) {
  const calc = () => {

  };
  document.getElementById("sRec").oninput = calc; document.getElementById("sAnos").oninput = calc; calc();
}

async function carregarCronograma(i) {
  const el = document.getElementById("crono");
  let c;
  try { c = await getJSON(`data/cronograma/${encodeURIComponent(i.c)}.json`); }
  catch { el.innerHTML = i.t === "DEB" ? "" : '<div class="nota" style="margin:0 0 6px">Cronograma: CRI/CRA ainda sem agenda pública; TIR e MOIC supõem pagamento único no vencimento.</div>'; return; }
  const nome = { J: "Juros", A: "Amortização", I: "Incorporação de juros (PIK)", P: "Prêmio", V: "Vencimento" };
  const fx = new Map((c.fluxo || []).map(([d, v]) => [d, v]));
  const iso = s => s.split("/").reverse().join("-");

  const datas = [...new Set(c.ev.map(e => e[0]))];
  const usados = new Set();
  const caixaDe = d => { const alvo = new Date(iso(d)).getTime(); let melhor = null, dist = 9e15;
    for (const [k, v] of fx) { const dd = Math.abs(new Date(k).getTime() - alvo); if (dd < dist && dd <= 3 * 864e5 && !usados.has(k)) { dist = dd; melhor = k; } }
    if (melhor) { usados.add(melhor); return fx.get(melhor); } return null; };
  const linhas = datas.map(d => {
    const evs = c.ev.filter(e => e[0] === d);
    const desc = evs.map(e => e[1] === "J" ? `Juros ${c.base === "%DI" ? f2.format(e[2]) + "% DI" : (c.base === "PRE" ? "" : (c.base || "").replace("+", "") + " + ") + f2.format(e[2]) + "%"}`
      : e[1] === "A" ? `Amort. ${f2.format(e[2])}% ${e[3] === "FIX" ? "do VNE" : "do saldo"}` : e[1] === "I" ? `PIK ${f2.format(e[2])}%` : nome[e[1]]).join(" · ");
    const cx = caixaDe(d);
    const pik = evs.some(e => e[1] === "I"), amort = evs.some(e => e[1] === "A" || e[1] === "V");
    return { d, desc, cx, pik, amort };
  });
  const tot = linhas.reduce((s, l) => s + (l.cx || 0), 0);
  const nA = c.ev.filter(e => e[1] === "A").length, nI = c.ev.filter(e => e[1] === "I").length;
  const conf = c.escok === true ? ' <span class="tag t-info" title="Datas e percentuais de amortização iguais aos da escritura/aditamento lidos na CVM">conferido com a escritura</span>'
    : c.escok === false ? ' <span class="tag t-warn" title="A escritura/aditamento lido traz datas ou percentuais diferentes da agenda do SND">diverge da escritura</span>' : "";
  const aj = c.aj?.length ? `<div class="nota" style="margin:0 0 6px">Agenda do SND ajustada pela escritura: ${c.aj.map(x => x === "base" ? "base das amortizações (% do saldo × % do valor de emissão)" : "percentuais de amortização que o SND não informa").join(" e ")}.</div>` : "";
  el.innerHTML = `<h4 style="font-size:13px;margin:14px 0 4px">Cronograma (agenda SND)${conf}</h4>${aj}
    <div class="sub" style="margin-bottom:6px">${c.ev.filter(e => e[1] === "J").length} pagamentos de juros · ${nA ? nA + (nA > 1 ? " amortizações" : " amortização") : "principal no vencimento (bullet)"}${nI ? ` · <span class="neg">${nI} incorporações de juros (PIK)</span>` : ""}${tot ? ` · total projetado R$ ${f2.format(tot)} por debênture` : ""}</div>
    <div class="card tw" style="max-height:300px"><table><thead><tr><th class="l">Pagamento</th><th class="l">Evento</th><th title="Projeção com a curva ANBIMA de ${dbr(c.curva)}">Caixa proj. (R$)</th></tr></thead>
    <tbody>${linhas.map(l => `<tr style="cursor:default"><td class="l">${l.d}</td><td class="l" style="white-space:normal;min-width:140px">${esc(l.desc)}</td><td>${l.pik && !l.cx ? '<span class="mut">incorporado</span>' : l.cx ? (l.amort ? "<b>" + f2.format(l.cx) + "</b>" : f2.format(l.cx)) : "–"}</td></tr>`).join("")}</tbody></table></div>
    <div class="nota" style="margin-top:4px">Caixa projetado por debênture, supondo pagamento integral: DI futuro e inflação implícita da curva ANBIMA de ${dbr(c.curva)}, escalado para o PU par de hoje (R$ ${fmt(c.par)}).</div>`;
}

// ------------------------------------------------------------------ tela: curva de juros
async function telaCurva() {
  const c = await getJSON("data/curva.json");
  const sv = (p, t) => { const [b1, b2, b3, b4, l1, l2] = p, x1 = l1 * t, x2 = l2 * t, f1_ = (1 - Math.exp(-x1)) / x1, f2_ = (1 - Math.exp(-x2)) / x2;
    return (b1 + b2 * f1_ + b3 * (f1_ - Math.exp(-x1)) + b4 * (f2_ - Math.exp(-x2))) * 100; };
  const T = []; for (let t = 0.25; t <= 15.001; t += 0.25) T.push(t);
  const pre = T.map(t => sv(c.pre, t)), ipca = T.map(t => sv(c.ipca, t)), inf = T.map((t, k) => ((1 + pre[k] / 100) / (1 + ipca[k] / 100) - 1) * 100);
  const W = Math.max(320, Math.min(760, document.getElementById("app").clientWidth - 30)), H = W < 450 ? 230 : 300, m = { l: 40, r: 12, t: 14, b: 26 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const hi = Math.ceil(Math.max(...pre) + 1), lo = 0;
  const x = t => m.l + (t - 0.25) / (15 - 0.25) * iw, y = v => m.t + (1 - (v - lo) / (hi - lo)) * ih;
  const linha = (arr, cor, dash) => `<path d="${arr.map((v, k) => (k ? "L" : "M") + x(T[k]).toFixed(1) + "," + y(v).toFixed(1)).join("")}" fill="none" stroke="${cor}" stroke-width="2" ${dash ? 'stroke-dasharray="5 4"' : ""}/>`;
  const grid = [0, 4, 8, 12, 16].filter(v => v <= hi).map(v => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text class="eixo" x="${m.l - 6}" y="${y(v) + 3}" text-anchor="end">${v}%</text>`).join("");
  const xt = (W < 450 ? [1, 3, 5, 10, 15] : [1, 2, 3, 5, 7, 10, 15]).map(t => `<text class="eixo" x="${x(t)}" y="${H - 8}" text-anchor="middle">${t}a</text>`).join("");
  const tab = [0.5, 1, 2, 3, 5, 10].map(t => { const a = sv(c.pre, t), b = sv(c.ipca, t); return `<tr><td class="l">${t < 1 ? "6 meses" : t + (t > 1 ? " anos" : " ano")}</td><td>${f2.format(a)}%</td><td>${f2.format(b)}%</td><td>${f2.format(((1 + a / 100) / (1 + b / 100) - 1) * 100)}%</td></tr>`; }).join("");
  document.getElementById("app").innerHTML = `
    <h2>Curva de juros</h2><div class="sub">Estrutura a termo ANBIMA de ${dbr(c.data)} (Svensson). Usada para projetar o DI futuro e a inflação implícita nos fluxos dos títulos.</div>
    <div class="card graf" style="padding:12px 14px;margin-top:14px">
      <div class="legenda"><span><i style="background:var(--series-1)"></i>Prefixada (≈ DI futuro)</span><span><i style="background:var(--series-2)"></i>IPCA (juro real)</span><span><i style="background:var(--text-muted)"></i>Inflação implícita</span></div>
      <svg viewBox="0 0 ${W} ${H}" id="svgC">${grid}${xt}${linha(pre, "var(--series-1)")}${linha(ipca, "var(--series-2)")}${linha(inf, "var(--text-muted)", true)}
        <line id="crossC" y1="${m.t}" y2="${m.t + ih}" stroke="var(--text-muted)" style="display:none"/><rect id="hitC" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>
    </div>
    <div class="card tw" style="margin-top:12px"><table><thead><tr><th class="l">Prazo</th><th>Prefixada</th><th>IPCA (real)</th><th>Inflação implícita</th></tr></thead><tbody>${tab}</tbody></table></div>
    <div class="nota">Taxas ao ano, base 252. Fonte: ANBIMA, ETTJ, atualizada nos dias úteis junto com a coleta.</div>`;
  const svg = document.getElementById("svgC"), hit = document.getElementById("hitC"), cr = document.getElementById("crossC"), tip = document.getElementById("tip");
  const mv = ev => { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const sx = pt.matrixTransform(svg.getScreenCTM().inverse()).x;
    const k = Math.max(0, Math.min(T.length - 1, Math.round((sx - m.l) / iw * (T.length - 1))));
    cr.setAttribute("x1", x(T[k])); cr.setAttribute("x2", x(T[k])); cr.style.display = "";
    tip.innerHTML = `<b>${f2.format(T[k])} anos</b><br>Pré: ${f2.format(pre[k])}%<br>IPCA: ${f2.format(ipca[k])}%<br>Inflação: ${f2.format(inf[k])}%`;
    tip.style.display = "block"; tip.style.left = Math.min(ev.clientX + 14, innerWidth - 150) + "px"; tip.style.top = (ev.clientY - 10) + "px"; };
  hit.addEventListener("mousemove", mv); hit.addEventListener("click", mv);
  hit.addEventListener("mouseleave", () => { cr.style.display = "none"; tip.style.display = "none"; });
}

// ponto: [data, pu_med, qtd, volume, n_neg, pu_anb, tx_ind, pct_par_anb, pu_par, pct_par_neg, y, tir]
function desenhar(pts) {
  const g = document.getElementById("graf");
  if (!pts.length) { g.innerHTML = '<span class="mut">Sem histórico ainda.</span>'; return; }
  const temPar = pts.some(p => p[9] != null || p[7] != null);
  const kN = temPar ? 9 : 1, kA = temPar ? 7 : 5;
  const W = Math.max(320, Math.min(600, g.clientWidth || 600)), H = W < 450 ? 200 : 220, HV = 100, m = { l: 52, r: 10, t: 10, b: 22 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, ihv = HV - m.t - m.b, N = pts.length;
  const x = i => m.l + (N === 1 ? iw / 2 : i / (N - 1) * iw);
  const vals = pts.flatMap(p => [p[kN], p[kA]]).filter(v => v != null);
  let lo = vals.length ? Math.min(...vals) : 0, hi = vals.length ? Math.max(...vals) : 1;
  const pad = (hi - lo) * .1 || Math.abs(hi) * .02 || 1; lo -= pad; hi += pad;
  const y = v => m.t + (1 - (v - lo) / (hi - lo)) * ih;
  const vmax = Math.max(...pts.map(p => p[3] || 0)) || 1, yv = v => m.t + (1 - v / vmax) * ihv;
  const ff = temPar ? (v => f1.format(v) + "%") : (v => f2.format(v));
  const grid = [0, 1, 2, 3, 4].map(k => { const v = lo + (hi - lo) * k / 4; return `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text class="eixo" x="${m.l - 6}" y="${y(v) + 3}" text-anchor="end">${ff(v)}</text>`; }).join("");
  const xl = [...new Set([0, Math.floor((N - 1) / 2), N - 1])].map(i => `<text class="eixo" x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === N - 1 ? "end" : "middle"}">${dbr(pts[i][0]).slice(0, 5)}</text>`).join("");
  const linha = (k, cor, pontos) => {
    let d = "", pen = false;
    pts.forEach((p, i) => { if (p[k] == null) { if (!pontos) pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(p[k]).toFixed(1); pen = true; });
    const c = pontos && N <= 90 ? pts.map((p, i) => p[k] == null ? "" : `<circle cx="${x(i)}" cy="${y(p[k])}" r="3" fill="${cor}" stroke="var(--surface-1)" stroke-width="2"/>`).join("") : "";
    return `<path d="${d}" fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${c}`;
  };
  const bw = Math.max(1, Math.min(14, iw / N - 2));
  const barras = pts.map((p, i) => p[3] ? `<rect x="${x(i) - bw / 2}" y="${yv(p[3])}" width="${bw}" height="${m.t + ihv - yv(p[3])}" rx="${Math.min(2, bw / 2)}" fill="var(--bar)"/>` : "").join("");
  g.innerHTML = `
    <h4>${temPar ? "% do par" : "Preço unitário"}</h4>
    <div class="legenda"><span><i style="background:var(--series-1)"></i>Negociado (B3)</span><span><i style="background:var(--series-2)"></i>Indicativo ANBIMA</span></div>
    <svg viewBox="0 0 ${W} ${H}" id="svgP">${grid}${xl}${linha(kA, "var(--series-2)", false)}${linha(kN, "var(--series-1)", true)}
      <line id="cross" y1="${m.t}" y2="${m.t + ih}" stroke="var(--text-muted)" stroke-width="1" style="display:none"/>
      <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/></svg>
    ${pts.some(p => p[3]) ? `<h4>Volume negociado (R$)</h4>
    <svg viewBox="0 0 ${W} ${HV}"><line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ihv}" y2="${m.t + ihv}"/><text class="eixo" x="${m.l - 6}" y="${m.t + 6}" text-anchor="end">${mi(vmax)}</text>${barras}</svg>` : ""}
    <h4>Últimos pregões</h4>
    <div class="card tw" style="max-height:260px"><table><thead><tr><th class="l">Data</th><th>PU médio</th><th>% par</th><th>Yield</th><th>TIR</th><th>PU ANBIMA</th><th>Volume</th><th>Negócios</th></tr></thead>
    <tbody>${pts.slice(-30).reverse().map(p => `<tr><td class="l">${dbr(p[0])}</td><td>${fmt(p[1])}</td><td>${pctPar(p[9] ?? null)}</td><td>${nada(p[10]) ? "–" : f2.format(p[10]) + "%"}</td><td>${nada(p[11]) ? "–" : f1.format(p[11]) + "%"}</td><td>${fmt(p[5])}</td><td>${p[3] ? mi(p[3]) : "–"}</td><td>${p[4] ? f0.format(p[4]) : "–"}</td></tr>`).join("")}</tbody></table></div>`;
  const svg = document.getElementById("svgP"), hit = document.getElementById("hit"), cross = document.getElementById("cross"), tip = document.getElementById("tip");
  const mover = ev => {
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const sx = pt.matrixTransform(svg.getScreenCTM().inverse()).x;
    const i = Math.max(0, Math.min(N - 1, Math.round((sx - m.l) / (iw || 1) * (N - 1)))), p = pts[i];
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.style.display = "";
    tip.innerHTML = `<b>${dbr(p[0])}</b><br>Negociado: ${p[kN] == null ? "–" : ff(p[kN])}<br>ANBIMA: ${p[kA] == null ? "–" : ff(p[kA])}<br>Volume: ${p[3] ? "R$ " + mi(p[3]) : "–"}`;
    tip.style.display = "block"; tip.style.left = Math.min(ev.clientX + 14, innerWidth - 170) + "px"; tip.style.top = (ev.clientY - 10) + "px";
  };
  hit.addEventListener("mousemove", mover); hit.addEventListener("click", mover);
  hit.addEventListener("mouseleave", () => { cross.style.display = "none"; tip.style.display = "none"; });
}

(async () => {
  try {
    st.idx = await getJSON("data/index.json");
    document.getElementById("ref").textContent = st.idx.ultima ? "Último pregão: " + dbr(st.idx.ultima) : "";
  } catch { st.idx = { ultima: null, datas: [] }; }
  rota();
})();
